site_name: Living Networked Compendium
site_description: A progressive, community-built guide for network engineers — enterprise, carrier, data centre, RF/satellite, and beyond.
site_author: Community Contributors
# site_url: https://your-custom-domain.com   # Update once GitHub Pages / custom domain is configured
repo_url: https://github.com/geekazoid80/Living-Networked-Compendium
repo_name: Living-Networked-Compendium
edit_uri: edit/main/

copyright: "Content: CC BY-SA 4.0 | Code: Apache 2.0 | Living Networked Compendium Contributors"

# mkdocs.yml keeps the default `docs_dir: docs`. The site is built from a
# staged docs/ tree: `tools/scripts/build-web.sh` copies repo-root content
# (README.md, CONTRIBUTING.md, learning-paths/, modules/, etc.) into docs/
# before invoking `mkdocs build`. The staged copies are gitignored.
# This indirection exists because mkdocs does not permit `docs_dir` to be
# the parent directory of mkdocs.yml.

# These files live in docs/ but are intentionally NOT in the nav:
#   - TASK.md is contributor task tracking, not user-facing.
#   - front-matter/ compiles into the handout PDF (book intro pages),
#     not the web site.
not_in_nav: |
  TASK.md
  front-matter/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - def_list
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/geekazoid80/Living-Networked-Compendium
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

