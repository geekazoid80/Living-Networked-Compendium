name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

permissions:
  contents: write      # Needed to create releases and push to gh-pages
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Validate module frontmatter
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required frontmatter fields
        run: |
          ERRORS=0
          REQUIRED_FIELDS=("title" "module_id" "domain" "difficulty" "prerequisites" "estimated_time" "version" "last_updated" "maintainer" "human_reviewed" "ai_assisted")

          # Use process substitution rather than `find | while read` so the
          # loop body runs in the parent shell. Previous form piped find into
          # while-read, which forks the loop into a subshell; ERRORS=$((...))
          # mutations there never propagate back, so the `if [[ $ERRORS -gt 0 ]]`
          # gate at the end always saw 0 and the job silently passed even when
          # ::error:: lines were emitted (caught in v044 / v045 post-merge runs
          # against modules/fundamentals/routing/{route-redistribution,
          # ospf-advanced,bgp-advanced}.md).
          while IFS= read -r FILE; do
            # Extract frontmatter block (between first pair of ---)
            FRONTMATTER=$(awk '/^---/{if(p==1){exit}; p=1; next} p' "$FILE")

            for FIELD in "${REQUIRED_FIELDS[@]}"; do
              if ! echo "$FRONTMATTER" | grep -q "^${FIELD}:"; then
                echo "::error file=${FILE}::Missing required frontmatter field: ${FIELD}"
                ERRORS=$((ERRORS + 1))
              fi
            done

            # Value-level checks (CONTRIBUTION_SPEC.md § 3.2). Each check skips
            # silently when the field is absent because the presence loop above
            # has already emitted ::error:: for that case; we don't want to
            # double-count or chain-error on already-missing fields.
            MODULE_ID_VAL=$(echo "$FRONTMATTER" | grep "^module_id:" | head -1 | sed -E 's/^module_id:[[:space:]]*//;s/[[:space:]]+$//;s/^"//;s/"$//')
            if [[ -n "$MODULE_ID_VAL" && ! "$MODULE_ID_VAL" =~ ^[A-Z]+-[0-9]+$ ]]; then
              echo "::error file=${FILE}::Invalid module_id '${MODULE_ID_VAL}': expected uppercase letters, hyphen, digits (e.g. NW-001)"
              ERRORS=$((ERRORS + 1))
            fi

            DIFFICULTY_VAL=$(echo "$FRONTMATTER" | grep "^difficulty:" | head -1 | sed -E 's/^difficulty:[[:space:]]*//;s/[[:space:]]+$//;s/^"//;s/"$//')
            if [[ -n "$DIFFICULTY_VAL" && ! "$DIFFICULTY_VAL" =~ ^(beginner|intermediate|advanced)$ ]]; then
              echo "::error file=${FILE}::Invalid difficulty '${DIFFICULTY_VAL}': must be one of beginner / intermediate / advanced"
              ERRORS=$((ERRORS + 1))
            fi

            LAST_UPDATED_VAL=$(echo "$FRONTMATTER" | grep "^last_updated:" | head -1 | sed -E 's/^last_updated:[[:space:]]*//;s/[[:space:]]+$//;s/^"//;s/"$//')
            if [[ -n "$LAST_UPDATED_VAL" && ! "$LAST_UPDATED_VAL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error file=${FILE}::Invalid last_updated '${LAST_UPDATED_VAL}': expected ISO date YYYY-MM-DD"
              ERRORS=$((ERRORS + 1))
            fi

            VERSION_VAL=$(echo "$FRONTMATTER" | grep "^version:" | head -1 | sed -E 's/^version:[[:space:]]*//;s/[[:space:]]+$//;s/^"//;s/"$//')
            if [[ -n "$VERSION_VAL" && ! "$VERSION_VAL" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error file=${FILE}::Invalid version '${VERSION_VAL}': expected SemVer or MAJOR.MINOR (e.g. 1.0 or 1.0.0)"
              ERRORS=$((ERRORS + 1))
            fi

            # Check for prerequisite module IDs that don't exist
            PREREQS=$(echo "$FRONTMATTER" | grep "^prerequisites:" | \
                      grep -oP '"[A-Z]+-[0-9]+"' | tr -d '"' || true)
            for PREREQ in $PREREQS; do
              if ! find modules/ -name "*.md" | xargs grep -l "^module_id: \"${PREREQ}\"" &>/dev/null; then
                echo "::warning file=${FILE}::Prerequisite '${PREREQ}' not found as a module"
              fi
            done
          done < <(find modules/ -name "*.md" ! -name ".gitkeep" ! -path '*/_*')

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::${ERRORS} frontmatter validation error(s) found"
            exit 1
          fi
          echo "All module frontmatter validated successfully."

      - name: Check mkdocs.yml nav coverage
        run: |
          ERRORS=0

          # Extract all modules/ paths listed in the mkdocs.yml nav block.
          # Nav entries take the form "  - Label: modules/path/file.md".
          # Uses GNU grep -P (available on ubuntu-latest; not macOS BSD grep).
          # || true: grep returns exit 1 on zero matches; we handle that case
          # via the ERRORS gate rather than letting the shell exit early.
          NAV_MODULE_PATHS=$(grep -oP '(?<=: )(modules/[^\s"#]+\.md)' mkdocs.yml | sort -u || true)

          # ── Direction 1: Orphan check ─────────────────────────────────────
          # Every modules/ file must appear in the nav.
          # Same find pattern as the frontmatter check above; excludes
          # .gitkeep and _* template directories.
          while IFS= read -r FILE; do
            if ! echo "$NAV_MODULE_PATHS" | grep -qxF "$FILE"; then
              echo "::error file=${FILE}::Module not listed in mkdocs.yml nav — add it to the nav before merging"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find modules/ -name "*.md" ! -name ".gitkeep" ! -path '*/_*')

          # ── Direction 2: Dangling-reference check ────────────────────────
          # Every nav path must point to a file that actually exists.
          # Uses -f not find, so _* template files referenced intentionally
          # (e.g. "_new-path-template/overview.md") pass correctly.
          # Guard against empty NAV_PATH: a here-string always appends a
          # trailing newline, which produces one empty read if the variable
          # is empty; skip those to avoid a spurious "non-existent file: "
          # error.
          while IFS= read -r NAV_PATH; do
            [[ -z "$NAV_PATH" ]] && continue
            if [[ ! -f "$NAV_PATH" ]]; then
              echo "::error::mkdocs.yml nav references non-existent file: ${NAV_PATH}"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$NAV_MODULE_PATHS"

          if [[ $ERRORS -gt 0 ]]; then
            echo "::error::${ERRORS} nav coverage error(s) found"
            exit 1
          fi
          echo "mkdocs.yml nav coverage check passed."

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build MkDocs site and deploy to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs dependencies
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-git-revision-date-localized-plugin

      - name: Build MkDocs site
        run: |
          chmod +x tools/scripts/build-web.sh
          ./tools/scripts/build-web.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: ""   # Set to your custom domain (e.g. compendium.example.com) or leave empty

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Generate versioned PDF and PPTX handouts
  # ─────────────────────────────────────────────────────────────────────────────
  build-handouts:
    name: Build Handouts (PDF + PPTX)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_dir: ${{ steps.version.outputs.version_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended \
            texlive-plain-generic fonts-liberation

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Determine version number
        id: version
        run: |
          # Version = number of commits on main (simple, monotonic)
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(printf "v%03d" "$COUNT")
          DATE=$(date +%Y-%m-%d)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_dir=${VERSION}-${DATE}" >> "$GITHUB_OUTPUT"
          echo "Building handout ${VERSION} (${DATE})"

      - name: Create handout directory
        run: mkdir -p "handouts/versions/${{ steps.version.outputs.version_dir }}"

      - name: Build PDF
        run: |
          chmod +x tools/scripts/build-pdf.sh
          # Extract version number from the v0NN string
          VER_NUM=$(echo "${{ steps.version.outputs.version }}" | grep -oP '[0-9]+')
          ./tools/scripts/build-pdf.sh "$VER_NUM"
        # No `continue-on-error` here. The earlier flag masked a real pandoc
        # invocation bug (--syntax-highlighting=tango is not a pandoc flag;
        # --highlight-style=tango is) for several releases. We want loud
        # failure if the PDF build breaks again.

      - name: Build PPTX slides
        run: |
          chmod +x tools/scripts/build-pptx.sh
          VER_NUM=$(echo "${{ steps.version.outputs.version }}" | grep -oP '[0-9]+')
          ./tools/scripts/build-pptx.sh "$VER_NUM"
        # Previously `continue-on-error: true` while marp's per-module
        # behaviour was untested. v041 and v043 each produced all 66 PPTX
        # cleanly, so marp is empirically reliable on this content. Tightened
        # to fail-fast so a future marp regression on any one module blocks
        # the release rather than silently dropping that module's slides.

      - name: Generate change sheet vs previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.version.outputs.version }}"

          # Previous release tag = second entry in the most-recent two.
          # Empty if this is the first release ever.
          PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty')
          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found; skipping change sheet (first release)."
            exit 0
          fi
          echo "Generating change sheet: $NEW_TAG vs $PREV_TAG"

          # generate-changelog.sh expects to find a directory matching
          # handouts/versions/<prev-tag>-* with that release's MANIFEST.md
          # inside. handouts/versions/ is gitignored, so the prior version's
          # MANIFEST is not on disk; pull it from the previous GitHub Release
          # asset into a placeholder directory.
          PLACEHOLDER_DIR="handouts/versions/${PREV_TAG}-prev-release"
          mkdir -p "$PLACEHOLDER_DIR"
          if ! gh release download "$PREV_TAG" --pattern 'MANIFEST.md' \
                                                --dir "$PLACEHOLDER_DIR"; then
            echo "Could not fetch MANIFEST.md from release $PREV_TAG; skipping changelog."
            rm -rf "$PLACEHOLDER_DIR"
            exit 0
          fi

          chmod +x tools/scripts/generate-changelog.sh
          ./tools/scripts/generate-changelog.sh "$PREV_TAG" "$NEW_TAG"

          # Drop the placeholder so the upload step only picks up the new
          # version's directory (which now contains the generated CHANGES file).
          rm -rf "$PLACEHOLDER_DIR"
        continue-on-error: true   # changelog is nice-to-have; never block release

      - name: Upload handout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handouts-${{ steps.version.outputs.version }}
          path: handouts/versions/${{ steps.version.outputs.version_dir }}/
          retention-days: 90
          # If nothing was produced (e.g. PDF build hard-failed AND no PPTX
          # slides were written), surface that loudly rather than silently
          # uploading nothing and then watching Create Release fall over
          # with "Artifact not found".
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Create GitHub Release with handout artifacts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-handouts
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download handout artifacts
        uses: actions/download-artifact@v4
        with:
          name: handouts-${{ needs.build-handouts.outputs.version }}
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-handouts.outputs.version }}
          name: "Compendium ${{ needs.build-handouts.outputs.version }}"
          body: |
            ## Living Networked Compendium — ${{ needs.build-handouts.outputs.version }}

            Auto-generated handout release from commit ${{ github.sha }}.

            ### Included Files
            - **PDF**: Combined handout (all modules)
            - **PPTX**: Per-module slide decks
            - **MANIFEST.md**: List of all included modules
            - **CHANGES-vNNN-vs-vMMM.md**: Change sheet vs previous version (present from the second release onward)

            ### How to Use
            - **For self-study**: Download the PDF handout
            - **For training delivery**: Download individual PPTX slide decks
            - For what changed since the previous release, see the `CHANGES-*` asset attached to this release

            ---
            Content: CC BY-SA 4.0 | Code: Apache 2.0
          files: release-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
